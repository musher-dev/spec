# The regression pin for the listing's item-scoped rules: slug equal to the
# directory, version equal to the sibling blueprint's, and both media paths
# resolving to files inside the item. A careless containment check rejects this.
specVersion: v1
kind: LISTING
metadata:
  slug: acme-wiki
  version: 1
spec:
  listingKind: BLUEPRINT
  displayName: Acme Wiki
  summary: A wiki backed by PostgreSQL
  category: PRODUCTIVITY
  lifecycleStage: STABLE
  icon: media/icon.png
  screenshots:
    - file: media/overview.png
