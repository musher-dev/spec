# Both things the grammar has to keep accepting: a nested directory under
# media/, and an extension in upper case. A JSON Schema pattern carries no
# case-insensitive flag, so the alternation spells the cases out.
specVersion: v1
kind: LISTING
metadata:
  slug: postgres
  version: 1
spec:
  listingKind: COMPONENT
  displayName: PostgreSQL
  summary: The open-source relational database
  category: INFRASTRUCTURE
  lifecycleStage: STABLE
  icon: media/icon.png
  screenshots:
    - file: media/shots/desktop.JPEG
      caption: The connection panel
    - file: media/shots/mobile.webp
