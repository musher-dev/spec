# PUBLIC_URL derives an externally reachable address, and a PRIVATE endpoint
# has none to give.
specVersion: v1
kind: COMPONENT
metadata:
  version: 1
spec:
  workload:
    kind: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      internal:
        containerPort: 8080
        protocol: HTTP
        visibility: PRIVATE
  contract:
    inputs:
      selfUrl:
        schema:
          type: STRING
        platformDefault:
          source: PUBLIC_URL
          endpoint: internal
        ui:
          label: Own URL
    outputs: {}
