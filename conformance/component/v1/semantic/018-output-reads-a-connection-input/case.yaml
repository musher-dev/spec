# The one input an output may not read. A CONNECTION input resolves only after
# its edge is bound, so an output reading one would depend on an inbound edge —
# and §6.2's whole reason for existing is that every output in a composition is
# resolvable before any edge is bound, which is what makes blueprint §4.2's
# legal cycles resolvable rather than merely cyclic.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
        visibility: PRIVATE
  contract:
    inputs:
      databaseUrl:
        schema:
          type: STRING
          sensitive: true
        suppliedBy: CONNECTION
    outputs:
      databaseUrl:
        schema:
          type: STRING
          sensitive: true
        valueFrom: INPUT
        input: databaseUrl
