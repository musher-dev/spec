# The platform default derives from "console", and the only endpoint is "api".
# JSON Schema cannot catch it: the endpoint names are mapping keys elsewhere
# in the document.
specVersion: v1
kind: COMPONENT
metadata:
  version: 1
spec:
  workload:
    kind: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      api:
        containerPort: 8080
        protocol: HTTP
        visibility: PUBLIC
    health:
      readiness:
        path: /healthz
        endpoint: api
  contract:
    inputs:
      consoleUrl:
        schema:
          type: STRING
        platformDefault:
          source: PUBLIC_URL
          endpoint: console
        ui:
          label: Console URL
    outputs: {}
