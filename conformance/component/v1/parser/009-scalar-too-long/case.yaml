# The document is small and the structure is valid. One scalar is over the
# 64 KiB bound, which is enough on its own: the bound is on the scalar, not on
# the file, because a single enormous value is a parser cost a small file can
# still impose.
specVersion: v1
kind: COMPONENT
metadata:
  version: 1
spec:
  workload:
    kind: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    envVars:
      - key: PADDING
        value:
          type: LITERAL
          value: 
