# Without a readiness gate the public URL routes to a replica that is running
# but not yet serving, so the first request a user makes is the one that
# fails. A browser does not retry.
specVersion: v1
kind: COMPONENT
metadata:
  version: 1
spec:
  workload:
    kind: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
        visibility: PUBLIC
