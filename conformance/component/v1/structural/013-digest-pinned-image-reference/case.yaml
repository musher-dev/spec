# Both accepted spellings of a pin, and the case the grammar has to get
# right: the colon in localhost:5000 is a registry port, not a tag, so the tag
# is the colon after the final slash.
specVersion: v1
kind: COMPONENT
metadata:
  version: 1
spec:
  workload:
    kind: SERVICE
    source:
      type: IMAGE
      ref: localhost:5000/musher-dev/api@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    endpoints:
      api:
        containerPort: 8080
        protocol: HTTP
        visibility: PRIVATE
