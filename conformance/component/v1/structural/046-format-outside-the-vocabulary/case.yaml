# MULTILINE was proposed and declined: every `format` member names a lexical
# convention for text, and "the string may contain newlines" names a shape a
# box should have. This case pins the closedness of the vocabulary, which
# nothing asserted before — without it, a later change that opened the field
# would break no test and admitting a member would stop being a deliberate act.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
        visibility: PRIVATE
  contract:
    inputs:
      systemPrompt:
        schema:
          type: STRING
          format: MULTILINE
        ui:
          label: System prompt
    outputs: {}
