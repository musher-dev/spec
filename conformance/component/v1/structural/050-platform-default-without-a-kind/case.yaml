# `type` is REQUIRED and carries no default, for the reason COMP-GEN-001 gives
# for sensitive: a discriminator a document may leave out is one two
# implementations may read differently. This is the shape every document used
# to have, and it is the change that costs the pre-publication window.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
        visibility: PUBLIC
  contract:
    inputs:
      publicUrl:
        schema:
          type: STRING
        required: false
        ui:
          label: Public URL
        platformDefault:
          source: PUBLIC_URL
    outputs: {}
