# `kind` names a different family. Each family's schema constrains kind to
# its own constant, so a document cannot be validated by the wrong schema.
specVersion: v1
kind: BLUEPRINT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
        visibility: PRIVATE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
