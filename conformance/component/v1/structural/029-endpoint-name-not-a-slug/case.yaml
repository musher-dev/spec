# An endpoint name is referenced by probes and by platform defaults, and is
# composed into a DNS label beside the names identifying the deployment. A dot
# in one is a hazard rather than a matter of taste.
specVersion: v1
kind: COMPONENT
metadata:
  version: 1
spec:
  workload:
    kind: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web.api:
        containerPort: 8080
        protocol: HTTP
        visibility: PRIVATE
