# A component may front two public URLs. Each is addressed by name, which is
# what makes the second one no harder than the first.
specVersion: v1
kind: COMPONENT
metadata:
  version: 1
spec:
  workload:
    kind: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      api:
        containerPort: 8080
        protocol: HTTP
        visibility: PUBLIC
      console:
        containerPort: 8081
        protocol: HTTP
        visibility: PUBLIC
    health:
      readiness:
        path: /healthz
        endpoint: api
  contract:
    inputs:
      consoleUrl:
        schema:
          type: STRING
        platformDefault:
          source: PUBLIC_URL
          endpoint: console
        ui:
          label: Console URL
    outputs: {}
