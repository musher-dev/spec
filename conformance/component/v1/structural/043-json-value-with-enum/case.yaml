# The companion to 042, and a separate case because the two halves of the rule
# carry different codes. An empty `enum` is the unconstrained state, so the
# restriction is that the list stays empty rather than that the field is absent.
# The two members below are the same JSON value spelled two ways, which is the
# whole argument in one document.
specVersion: v1
kind: COMPONENT
metadata:
  version: 1
spec:
  workload:
    kind: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
        visibility: PRIVATE
  contract:
    inputs:
      settings:
        schema:
          type: JSON
          enum:
            - '{"a":1}'
            - '{ "a" : 1 }'
        ui:
          label: Advanced settings
    outputs: {}
