# `POSTGRES` was a member of the closed enum this field used to carry, so this
# case proves the withdrawal as well as the grammar: an unqualified term has no
# namespace, and the one form per identifier rule is what stops the old members
# becoming the privileged ones every later addition asks to join.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      primary:
        containerPort: 5432
        protocol: TCP
        visibility: PRIVATE
  contract:
    inputs: {}
    outputs:
      connectionString:
        schema:
          type: STRING
          resourceType: POSTGRES
        valueFrom: DERIVED
