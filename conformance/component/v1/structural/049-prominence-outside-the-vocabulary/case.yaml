# ADVANCED is the word the proposal reached for, and the vocabulary is
# PRIMARY/SECONDARY: a field's standing in the form, rather than a judgement
# about the reader. Pinned so the two members stay two.
specVersion: v1
kind: COMPONENT
metadata:
  version: 1
spec:
  workload:
    kind: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
        visibility: PRIVATE
  contract:
    inputs:
      hostname:
        schema:
          type: STRING
        ui:
          label: Public hostname
          prominence: ADVANCED
    outputs: {}
