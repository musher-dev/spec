# Everything §6.4 admits, in one document. `backend` declares no prominence and
# takes PRIMARY, which is the effective value pinned above; `hostname` is the
# case prominence exists for — optional and advanced, which `required` alone
# cannot say. `enumLabels` is keyed by the member so it cannot fall out of step
# with `enum` by length or by order, and one member is deliberately left
# unlabelled: it is offered as it is spelled.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
        visibility: PUBLIC
    health:
      readiness:
        path: /healthz
        endpoint: web
  contract:
    inputs:
      backend:
        schema:
          type: STRING
          enum:
            - S3
            - GCS
            - LOCAL
          default: LOCAL
        required: false
        ui:
          label: Storage backend
          order: 1
          enumLabels:
            S3: Amazon S3
            GCS: Google Cloud Storage
      hostname:
        schema:
          type: STRING
          format: HOSTNAME
        required: false
        ui:
          label: Public hostname
          order: 2
          prominence: SECONDARY
          examples:
            - wiki.example.com
        platformDefault:
          type: SELF_ADDRESS
          source: PUBLIC_HOSTNAME
          endpoint: web
    outputs: {}
