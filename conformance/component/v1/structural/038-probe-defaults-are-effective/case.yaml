# A readiness probe declaring nothing but `path`.
#
# Every timing field is absent, and each one has a `default` in the schema. A
# validator accepts this document either way, so acceptance is not what is
# being pinned here — `metadata.effective` is. Two implementations that both
# accept it can still poll on different intervals, and that is the divergence
# ADR 0008 exists to close.
specVersion: v1
kind: COMPONENT
metadata:
  version: 1
spec:
  workload:
    kind: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
        visibility: PUBLIC
    health:
      readiness:
        path: /healthz
