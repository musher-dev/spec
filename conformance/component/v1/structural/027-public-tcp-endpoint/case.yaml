# A PUBLIC endpoint is published at a URL by something that speaks the HTTP
# family, and TCP has no URL to publish. Readiness is present so the case
# fails on the protocol rule alone.
specVersion: v1
kind: COMPONENT
metadata:
  version: 1
spec:
  workload:
    kind: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      db:
        containerPort: 5432
        protocol: TCP
        visibility: PUBLIC
    health:
      readiness:
        path: /healthz
        endpoint: db
