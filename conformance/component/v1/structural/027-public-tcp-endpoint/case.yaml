# A PUBLIC TCP endpoint publishes a host:port edge address rather than a URL,
# which is a working capability — an exposed database, broker or game server.
# No readiness probe accompanies it: §5.4 compels one only for a PUBLIC
# endpoint in the HTTP family, because an L4 consumer retries and a browser
# does not.
specVersion: v1
kind: COMPONENT
metadata:
  version: 1
spec:
  workload:
    kind: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      db:
        containerPort: 5432
        protocol: TCP
        visibility: PUBLIC
