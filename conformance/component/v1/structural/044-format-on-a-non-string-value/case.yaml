# Every format member names a lexical convention for text, so the field refines
# a STRING and nothing else. URI on a NUMBER describes nothing; that it used to
# validate was an accident of the two fields never having been described
# together.
specVersion: v1
kind: COMPONENT
metadata:
  version: 1
spec:
  workload:
    kind: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
        visibility: PRIVATE
  contract:
    inputs:
      retries:
        schema:
          type: NUMBER
          format: URI
        ui:
          label: Retry count
    outputs: {}
