# A hyphen is what a composed DNS label uses to join an endpoint name to the
# names beside it. A name drawn from that same alphabet cannot be delimited:
# endpoint `api` on a component `web` and a component `api-web` would compose
# to one label. The grammar excludes the hyphen so the separator survives.
specVersion: v1
kind: COMPONENT
metadata:
  version: 1
spec:
  workload:
    kind: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      admin-console:
        containerPort: 8080
        protocol: HTTP
        visibility: PRIVATE
