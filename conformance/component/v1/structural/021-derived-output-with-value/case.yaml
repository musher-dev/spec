# A DERIVED output is resolved from the running workload. A static value here
# contradicts that, and nothing says which of the two a consumer would read.
specVersion: v1
kind: COMPONENT
metadata:
  version: 1
spec:
  workload:
    kind: SERVICE
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
        visibility: PRIVATE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
  contract:
    outputs:
      connectionString:
        schema:
          type: STRING
        valueFrom: DERIVED
        value: postgres://localhost:5432/app
