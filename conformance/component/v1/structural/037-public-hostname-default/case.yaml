# PUBLIC_HOSTNAME, which no case exercised. It takes the host part of the URL a
# PUBLIC HTTP-family endpoint publishes, so unlike PUBLIC_ADDRESS it is an
# HTTP-family source and this endpoint answers it.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      api:
        containerPort: 8080
        protocol: HTTPS
        visibility: PUBLIC
    health:
      readiness:
        path: /healthz
        endpoint: api
  contract:
    inputs:
      apiHostname:
        schema:
          type: STRING
        ui:
          label: API hostname
        platformDefault:
          type: SELF_ADDRESS
          source: PUBLIC_HOSTNAME
          endpoint: api
    outputs: {}
