# The parameter asks for a NUMBER; the input it covers declares a STRING.
# The deploying user is validated against the parameter's schema and the
# component then receives the result against its own, so nothing fails until the
# workload starts.
specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    api:
      componentRef: ./components/api.yaml
      size: general.standard.small
      connections: {}
    db:
      componentRef: ./components/postgres.yaml
      size: general.standard.small
      connections: {}
  parameters:
    adminPassword:
      schema:
        type: NUMBER
        sensitive: true
      required: true
      ui:
        label: Administrator password
