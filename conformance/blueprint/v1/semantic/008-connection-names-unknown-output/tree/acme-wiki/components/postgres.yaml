specVersion: v1
kind: COMPONENT
metadata:
  version: 1
spec:
  workload:
    kind: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      primary:
        containerPort: 5432
        protocol: TCP
        visibility: PRIVATE
  contract:
    inputs: {}
    outputs:
      connectionString:
        schema:
          type: STRING
          isSensitive: true
        valueFrom: DERIVED
        value: null
