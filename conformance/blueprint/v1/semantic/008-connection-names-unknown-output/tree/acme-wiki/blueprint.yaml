# `db` publishes `connectionString`; `web` asks for `connectionUri`. Both node
# names resolve, so ERR_UNKNOWN_ROLE does not fire — only reading the component
# document `db` deploys settles it, which is what makes this rule item-scoped.
specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    db:
      componentRef: ./components/postgres.yaml
      size: general.standard.small
      connections: {}
    web:
      componentRef: ./components/web.yaml
      size: general.standard.small
      connections:
        databaseUrl:
          fromRole: db
          fromOutput: connectionUri
  parameters: {}
