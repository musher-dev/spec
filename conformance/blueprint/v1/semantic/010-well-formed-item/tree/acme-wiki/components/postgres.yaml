specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      primary:
        containerPort: 5432
        protocol: TCP
        visibility: PRIVATE
  contract:
    inputs:
      adminPassword:
        schema:
          type: STRING
          sensitive: true
        suppliedBy: USER
        ui:
          label: Administrator password
    outputs:
      connectionString:
        schema:
          type: STRING
          sensitive: true
        valueFrom: DERIVED
