# `api` sorts first, so this is the declaration that stands. It leaves every
# schema default implicit.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      primary:
        containerPort: 5432
        protocol: TCP
        visibility: PRIVATE
  contract:
    inputs:
      adminPassword:
        schema:
          type: STRING
          sensitive: true
        suppliedBy: USER
        required: true
        ui:
          label: Administrator password
    outputs: {}
