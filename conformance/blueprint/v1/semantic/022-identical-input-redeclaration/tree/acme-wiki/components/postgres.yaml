# The same declaration, written differently. `sensitive` comes first here and
# `semanticType` is written out at the value it defaults to, so a byte-for-byte
# or key-order-sensitive comparison of the two schema blocks calls these
# different. §5.2's test is equality once defaults are applied, and by that test
# they are the same declaration.
#
# `ui` and `required` both differ, and §5.2 excludes both: they describe how a
# value is asked for, not what it is.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      primary:
        containerPort: 5432
        protocol: TCP
        visibility: PRIVATE
  contract:
    inputs:
      adminPassword:
        schema:
          sensitive: true
          type: STRING
        suppliedBy: USER
        required: false
        ui:
          label: Database superuser password
    outputs: {}
