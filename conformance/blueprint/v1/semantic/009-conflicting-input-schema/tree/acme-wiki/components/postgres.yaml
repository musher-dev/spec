specVersion: v1
kind: COMPONENT
metadata:
  version: 1
spec:
  workload:
    kind: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      primary:
        containerPort: 5432
        protocol: TCP
        visibility: PRIVATE
  contract:
    inputs:
      adminPassword:
        schema:
          type: INTEGER
          isSensitive: true
        suppliedBy: USER
        ui:
          label: Administrator password
    outputs: {}
