specVersion: v1
kind: COMPONENT
metadata:
  version: 1
spec:
  workload:
    kind: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      primary:
        containerPort: 5432
        protocol: TCP
        visibility: PRIVATE
  contract:
    inputs:
        siteTitle:
          schema:
            type: STRING
            default: Acme Wiki
          isRequired: false
          suppliedBy: USER
          ui:
            label: Site title
    outputs: {}
