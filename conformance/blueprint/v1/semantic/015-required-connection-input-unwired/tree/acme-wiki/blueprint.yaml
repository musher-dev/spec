# `web` requires databaseUrl over a connection, and declares none. A
# CONNECTION input never reaches the install form, so nothing downstream can
# supply it — the composition is already unsatisfiable here.
specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    db:
      componentRef: ./components/postgres.yaml
      size: general.standard.small
      connections: {}
    web:
      componentRef: ./components/web.yaml
      size: general.standard.small
      connections: {}
  parameters: {}
