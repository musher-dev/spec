# The reference is well-formed and resolves to nothing: the item ships
# `mysql.yaml` and the graph asks for `postgres.yaml`. A typo in a path is
# indistinguishable from a missing file until something looks on disk.
specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  version: 1
spec:
  components:
    db:
      component: ./components/postgres.yaml
      size: general.standard.small
      connections: {}
  parameters: {}
