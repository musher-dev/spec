# §5.3 makes the parameter key the whole of the correspondence between a
# parameter and the inputs it covers, so a key outside the input grammar could
# cover nothing — there is no input it could ever equal. Rejecting it
# structurally is cheaper than the `ERR_UNBOUND_PARAMETER` it would otherwise
# earn in the semantic phase, and it says why rather than only that.
specVersion: v1
kind: BLUEPRINT
metadata:
  slug: web
  revision: 1
spec:
  components:
    web:
      componentRef: ./components/web.yaml
      size: general.standard.small
      connections: {}
  parameters:
    Site_Title:
      schema:
        type: STRING
        default: My Application
      required: false
      ui:
        label: Site title
