# A connection key IS the input it fills, so it takes the input grammar rather
# than one of its own. `DATABASE_URL` is the mistake the rule exists to catch:
# it is the environment-variable name the value eventually lands on, which the
# consuming input's `target` carries, and keying the wire by it makes the wire
# look like it names a variable when it names an input.
specVersion: v1
kind: BLUEPRINT
metadata:
  slug: web-and-database
  revision: 1
spec:
  components:
    db:
      componentRef: ./components/postgres.yaml
      size: general.standard.small
      connections: {}
    web:
      componentRef: ./components/web.yaml
      size: general.standard.small
      connections:
        DATABASE_URL:
          fromRole: db
          fromOutput: connectionString
  parameters: {}
