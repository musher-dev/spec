specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      primary:
        containerPort: 5432
        protocol: TCP
        visibility: PRIVATE
  contract:
    inputs:
      telemetry:
        schema:
          type: STRING_LIST
          enum:
            - logs
            - metrics
        suppliedBy: USER
        ui:
          label: Telemetry to export
    outputs: {}
