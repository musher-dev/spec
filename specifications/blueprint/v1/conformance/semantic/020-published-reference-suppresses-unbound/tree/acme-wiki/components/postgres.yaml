specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    endpoints:
      primary:
        containerPort: 5432
        protocol: TCP
        visibility: PRIVATE
  contract:
    inputs:
      siteTitle:
        schema:
          type: STRING
          default: Acme Wiki
        required: false
        suppliedBy: USER
        ui:
          label: Site title
    outputs: {}
