# `db` publishes `connectionString` and `web` declares an input called
# `databaseUrl`, but the wire is keyed `databaseUri`. The producer end
# resolves, so ERR_UNKNOWN_OUTPUT does not fire — only the consumer end is
# misspelled, which is the half nothing checked before.
specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    db:
      componentRef: ./components/postgres.yaml
      size: general.standard.small
      connections: {}
    web:
      componentRef: ./components/web.yaml
      size: general.standard.small
      connections:
        databaseUri:
          fromRole: db
          fromOutput: connectionString
  parameters: {}
