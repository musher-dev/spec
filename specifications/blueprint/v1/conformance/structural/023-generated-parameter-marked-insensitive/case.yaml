# The other half of the rule. 022 omits sensitive and takes the false default;
# this one says false outright. Both leave a platform-minted secret unmarked, so
# both are rejected — the first for not answering, the second for the answer.
specVersion: v1
kind: BLUEPRINT
metadata:
  slug: acme-wiki
  revision: 1
spec:
  components:
    db:
      componentRef: ./components/postgres.yaml
      size: general.standard.small
      connections: {}
  parameters:
    adminPassword:
      schema:
        type: STRING
        sensitive: false
      generator:
        byteLength: 32
        encoding: HEX
      required: true
      ui:
        label: Administrator password
