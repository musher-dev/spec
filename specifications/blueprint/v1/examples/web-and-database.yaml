# yaml-language-server: $schema=https://schemas.musher.dev/blueprint/v1/blueprint.schema.json
#
# Two components wired together. Connections are consumer-anchored: the `web`
# node declares what it consumes and from which role, so a component never
# needs to know who will depend on it.
#
# The two nodes show that a repo-local reference does not mandate a directory
# layout — `db` names a document under `components/`, `web` a flat sibling.
#
# They also size independently. Compute is chosen per node rather than baked
# into the component, so the database gets more of it than the web server
# without either document changing.
specVersion: v1
kind: BLUEPRINT
metadata:
  slug: web-and-database
  version: 1
spec:
  components:
    db:
      component: ./components/postgres.yaml
      size: general.standard.medium
      # Optional pins narrowing which host may run this node. They never change
      # the compute `size` names — this asks for the profile's vCPU on a host
      # that dedicates it, not for more of it.
      advanced:
        cpuDedication: dedicated
      connections: {}
    web:
      component: ./component-web-server.yaml
      size: general.standard.small
      connections:
        DATABASE_URL:
          fromRole: db
          fromOutput: connectionString
  # A non-empty `parameters` is an authored override: it replaces the form that
  # would otherwise be derived from the graph's USER inputs, rather than adding
  # to it. Binding is by key and the key is the whole of the correspondence — a
  # parameter names no node and no target — so `siteTitle` here supplies the
  # `siteTitle` input of every component that declares one, which is what lets
  # one parameter serve two components.
  #
  # Overriding is a commitment: the derived set is not consulted, so every input
  # the deploying user would have had to type has to be named here. `siteTitle`
  # is the only one — the database password is generated, and `DATABASE_URL`
  # arrives over the wire above rather than through the form.
  parameters:
    siteTitle:
      schema:
        type: STRING
        default: My Application
      isRequired: false
      ui:
        label: Site title
