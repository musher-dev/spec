# A bare name is an implicit :latest. The deployed image would then change
# whenever the registry moved the tag, with no change to any document here.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
        visibility: PRIVATE
    source:
      type: IMAGE
      ref: nginx
