# A wire already answers the question a platform default answers, and nothing
# in the document would say which arrives. §6.1 recorded this as a gap —
# "suppliedBy is unconstrained by platformDefault in v1" — and a gap the shape
# can close is not one to describe.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
        visibility: PUBLIC
  contract:
    inputs:
      databaseUrl:
        schema:
          type: STRING
        suppliedBy: CONNECTION
        platformDefault:
          type: SELF_ADDRESS
          source: PUBLIC_URL
    outputs: {}
