# A SERVICE is not scheduled, so this schedule means nothing. Ignoring it
# would leave the author believing their service runs at 03:00, which is
# exactly the failure mode §2 refuses for any other misplaced field.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
        visibility: PRIVATE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    schedule:
      cron: "0 3 * * *"
