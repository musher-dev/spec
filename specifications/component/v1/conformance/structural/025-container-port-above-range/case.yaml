# 65535 is the last port there is; 65536 names one that cannot exist.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 65536
        protocol: HTTP
        visibility: PRIVATE
