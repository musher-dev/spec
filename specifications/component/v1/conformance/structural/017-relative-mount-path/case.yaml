# A mount path is resolved by the container runtime, not relative to anything
# in this document. A relative path has no meaning to resolve against.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
        visibility: PRIVATE
    source:
      type: IMAGE
      ref: postgres:17.10-alpine
    volumes:
      data:
        sizeGiB: 10
        mountPath: var/lib/postgresql/data
