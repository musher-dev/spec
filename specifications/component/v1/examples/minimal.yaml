# yaml-language-server: $schema=https://schemas.musher.dev/component/v1/component.schema.json
#
# The smallest component that validates: a service running a pinned image.
specVersion: v1
kind: COMPONENT
metadata:
  version: 1
spec:
  workload:
    kind: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
