# yaml-language-server: $schema=https://schemas.musher.dev/component/v1/component.schema.json
#
# A service fronting two public URLs, one public TCP port, and one private
# port. Because more than one endpoint is PUBLIC, nothing here may say "the
# component's URL" — every reference names the endpoint it means.
#
# Both of §5.2's address forms are read. `console` publishes a URL, so
# PUBLIC_URL takes it. `wire` is a PUBLIC TCP endpoint published at a host:port
# edge address, which compels no readiness probe and which PUBLIC_ADDRESS —
# never PUBLIC_URL — is the source for.
#
# `telemetry` is a STRING_LIST: its string form is a JSON array of members of
# `enum`, so its default is that array's text, and §6.4's derivation offers the
# three members at once rather than one of them.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      api:
        containerPort: 8080
        protocol: HTTP
        visibility: PUBLIC
      console:
        containerPort: 8081
        protocol: HTTP
        visibility: PUBLIC
      wire:
        containerPort: 5671
        protocol: TCP
        visibility: PUBLIC
      metrics:
        containerPort: 9090
        protocol: HTTP
        visibility: PRIVATE
    health:
      readiness:
        path: /healthz
        endpoint: api
  contract:
    inputs:
      consoleUrl:
        schema:
          type: STRING
        platformDefault:
          type: SELF_ADDRESS
          source: PUBLIC_URL
          endpoint: console
        ui:
          label: Console URL
        target:
          envVarKey: CONSOLE_URL
      wireAddress:
        schema:
          type: STRING
        platformDefault:
          type: SELF_ADDRESS
          source: PUBLIC_ADDRESS
          endpoint: wire
        ui:
          label: Wire protocol address
        target:
          envVarKey: WIRE_ADDRESS
      telemetry:
        schema:
          type: STRING_LIST
          enum:
            - logs
            - metrics
            - traces
          default: '["logs","metrics"]'
        required: false
        ui:
          label: Telemetry to export
          enumLabels:
            logs: Logs
            metrics: Metrics
            traces: Traces
        target:
          envVarKey: TELEMETRY_EXPORTERS
    outputs: {}
