# yaml-language-server: $schema=https://schemas.musher.dev/component/v1/component.schema.json
#
# A service fronting two public URLs, one public TCP port, and one private
# port. Because more than one endpoint is PUBLIC, nothing here may say "the
# component's URL" — the readiness probe and the platform default each name the
# endpoint they mean, and both name one in the HTTP family. `wire` is the other
# address form: a PUBLIC TCP endpoint published at a host:port edge address,
# which compels no probe and which no platform default may derive from.
specVersion: v1
kind: COMPONENT
metadata:
  version: 1
spec:
  workload:
    kind: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      api:
        containerPort: 8080
        protocol: HTTP
        visibility: PUBLIC
      console:
        containerPort: 8081
        protocol: HTTP
        visibility: PUBLIC
      wire:
        containerPort: 5671
        protocol: TCP
        visibility: PUBLIC
      metrics:
        containerPort: 9090
        protocol: HTTP
        visibility: PRIVATE
    health:
      readiness:
        path: /healthz
        endpoint: api
  contract:
    inputs:
      consoleUrl:
        schema:
          type: STRING
        platformDefault:
          source: PUBLIC_URL
          endpoint: console
        ui:
          label: Console URL
        target:
          envVarKey: CONSOLE_URL
    outputs: {}
