# yaml-language-server: $schema=https://schemas.musher.dev/component/v1/component.schema.json
#
# A node this platform does not run. §5.6 gives it `spec.external` instead of
# `spec.workload`: there is no image, no compute and no address of its own, and
# `resourceType` is what says which kind of service it addresses.
#
# The three values an application needs in order to reach that service arrive as
# USER inputs and leave as INPUT outputs. Publishing them from one node is the
# point: they are only meaningful as a set, and a consumer wiring two of them
# from this node is wiring them from one source by construction.
#
# §6.2's invariant holds here by a wide margin — a USER input resolves when the
# install form is submitted, which is earlier than a DERIVED output resolves.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  external:
    resourceType: dev.musher.llm.chat-completions
  contract:
    inputs:
      baseUrl:
        schema:
          type: STRING
          format: ENDPOINT_URL
          resourceType: dev.musher.llm.base-url
        ui:
          label: API base URL
          order: 1
          examples:
            - https://api.example.com/v1
        description: >-
          Base URL of the service this node addresses. Anything speaking the
          same wire will do; nothing here resolves it or connects to it.
      apiKey:
        schema:
          type: STRING
          sensitive: true
          resourceType: dev.musher.llm.api-key
        ui:
          label: API key
          order: 2
        description: Bearer credential presented to the service above.
      model:
        schema:
          type: STRING
          resourceType: dev.musher.llm.model-name
        required: false
        ui:
          label: Model name
          order: 3
          prominence: SECONDARY
        description: Name the service uses to select what answers.
    outputs:
      baseUrl:
        schema:
          type: STRING
          format: ENDPOINT_URL
          resourceType: dev.musher.llm.base-url
        valueFrom: INPUT
        input: baseUrl
      apiKey:
        schema:
          type: STRING
          sensitive: true
          resourceType: dev.musher.llm.api-key
        valueFrom: INPUT
        input: apiKey
      model:
        schema:
          type: STRING
          resourceType: dev.musher.llm.model-name
        valueFrom: INPUT
        input: model
