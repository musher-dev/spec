# Every line here ends CRLF. A repository checked out on Windows with
# core.autocrlf=true produces exactly this, and the document means the same
# thing it would with LF.
specVersion: v1
kind: COMPONENT
metadata:
  revision: 1
spec:
  workload:
    type: SERVICE
    source:
      type: IMAGE
      ref: nginx:1.29.4-alpine
    endpoints:
      web:
        containerPort: 8080
        protocol: HTTP
        visibility: PRIVATE
