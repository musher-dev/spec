# Musher Specification Taskfile
# Usage: task [task-name]
# List tasks: task --list
#
# This file stays at the repo root because Task only discovers `Taskfile.*`
# there: `--taskfile` would work but would break bare `task <name>`. It holds
# the entry points; the tasks themselves live in taskfiles/, included below.
# Everything else this repository configures lives in .config/ — see
# .config/README.md and docs/adr/0011-tooling-configuration-layout.md.

version: '3'

vars:
  TOOLS_DIR: tools
  SITE_DIR: site

env:
  # Keep bun's cache inside the workspace-visible cache dir the dev container
  # already provisions, so a rebuild does not re-download the world.
  BUN_INSTALL_CACHE_DIR: '{{.BUN_INSTALL_CACHE_DIR | default "/home/vscode/.cache/bun"}}'

# Namespaced except for build, which is flattened so `task bundle` and
# `task site:build` keep the names CI, the hooks and CONTRIBUTING use. An
# included file's `default` becomes the bare namespace, so `task setup` and
# `task check` still work.
includes:
  setup: taskfiles/setup.Taskfile.yml
  build:
    taskfile: taskfiles/build.Taskfile.yml
    flatten: true
  check: taskfiles/check.Taskfile.yml
  ci: taskfiles/ci.Taskfile.yml
  ledger: taskfiles/release.Taskfile.yml

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # ===========================================================================
  # Entry points
  #
  # The two aggregates live here rather than as a `default` inside their
  # modules: an included `default` is reachable as the bare namespace, but
  # `task --list` shows it as `check:default`, which hides the command a
  # newcomer most needs to find.
  # ===========================================================================

  setup:
    desc: Install tooling dependencies and git hooks
    cmds:
      - task: setup:tools
      - task: setup:hooks

  check:
    desc: Run every check CI runs
    cmds:
      - task: check:format
      - task: check:config
      - task: check:rulesets
      - task: check:types
      - task: check:schema
      - task: check:drift
      - task: check:examples
      - task: check:conformance
      - task: check:standards
      - task: check:parity
      - task: check:published
      - task: check:compat
      - task: check:test
      - task: check:commits
      - task: check:links
      - task: check:md
      - task: check:spelling
      - task: check:shell
      - task: check:workflow

  # ===========================================================================
  # Formatting
  # ===========================================================================

  fmt:
    desc: Format the tooling sources
    dir: '{{.TOOLS_DIR}}'
    cmds:
      - bun run biome format --write .

  fmt:md:
    desc: Apply the Markdown fixes markdownlint can make itself
    cmds:
      - >-
        tools/node_modules/.bin/markdownlint-cli2 --fix
        --config .config/markdown/markdownlint.jsonc
        "**/*.md" "#tools/node_modules" "#site" "#.github/pull_request_template.md"

  # ===========================================================================
  # Environment
  # ===========================================================================

  env:check:
    desc: Verify .devcontainer/.env has every key from .env.example
    cmds:
      - |
        bash -c '
        source .devcontainer/scripts/lib/env-check.sh
        env_check_drift .devcontainer/.env .devcontainer/.env.example
        '

  # ===========================================================================
  # Hooks — thin wrappers invoked by lefthook
  # ===========================================================================

  hooks:pre-commit:
    desc: Fast checks run on staged changes
    cmds:
      - task: check:format
      - task: check:schema

  hooks:pre-push:
    desc: Full verification before pushing
    cmds:
      - task: check

  # ===========================================================================
  # Housekeeping
  # ===========================================================================

  clean:
    desc: Remove generated output
    cmds:
      - rm -rf {{.SITE_DIR}}
      - rm -rf {{.TOOLS_DIR}}/node_modules
