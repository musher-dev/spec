name: Release Ledger

# Record a pending release in published.json, on the release-please branch,
# before the tag exists.
#
# The placement is the whole design. .github/rulesets/main-branch.json allows
# only squash merges and sets strict_required_status_checks_policy, so a release
# branch cannot merge while it is behind main. An entry written here is
# therefore guaranteed to describe the tree in the very commit that gets
# tagged — which is what lets check:published treat a tag with no ledger entry
# as a hard failure instead of something to tolerate after every release. See
# docs/adr/0023-published-bytes-are-immutable-release-assets.md §3.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-ledger-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Record pending release
    # Only release-please's own branches, and only in this repository: a fork
    # can name a branch `release-please--anything`, and nothing from a fork may
    # reach the step that holds the App token.
    if: startsWith(github.head_ref, 'release-please--') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The push authenticates as the release App, not with this token.
    permissions:
      contents: read
    steps:
      # No persisted credential: `task release:record` runs the branch's own
      # tooling, and nothing it runs should find a token in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: tools/.bun-version

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tooling dependencies
        working-directory: tools
        run: bun install --frozen-lockfile

      # Inserts or updates the entry for every untagged manifest version, so a
      # branch brought up to date with main gets fresh `tree` and `bundleSha256`
      # values rather than keeping stale ones.
      - name: Record the pending release
        run: task release:record

      - name: Detect a changed ledger
        id: ledger
        run: |
          set -euo pipefail
          if git diff --quiet -- published.json; then
            echo "published.json already current — nothing to push."
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git --no-pager diff -- published.json
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      # Minted only now, after the branch's tooling has finished running, and
      # handed only to the push below.
      - name: Mint the release App token
        id: app
        if: steps.ledger.outputs.changed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # Authored and signed off as the App's bot user — the identity
      # release-please's own commits carry and .github/release-please/config.json
      # names in `signoff` — so dco.yml finds a trailer equal to the author.
      - name: Commit the ledger entry
        if: steps.ledger.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          bot="${APP_SLUG}[bot]"
          id="$(gh api "users/${bot}" --jq .id)"
          git config user.name "$bot"
          git config user.email "${id}+${bot}@users.noreply.github.com"
          git add published.json
          # Hooks disabled: nothing from the branch runs while the App identity is set.
          git -c core.hooksPath=/dev/null commit --no-verify -s \
            -m 'chore(repo): record pending release in published.json'

      # Pushed as the App, so unlike a GITHUB_TOKEN push this one triggers
      # workflows: CI runs on the new head, which is what lets the required
      # checks report on the commit that will be merged, and check:published
      # re-derives the entry there. This workflow runs again too; `record` is
      # idempotent, so that run finds the ledger current and pushes nothing.
      - name: Push the ledger entry
        if: steps.ledger.outputs.changed == 'true'
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          git -c core.hooksPath=/dev/null \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push --no-verify origin "HEAD:refs/heads/${HEAD_REF}"
