name: Release Ledger

# Record a pending release in published.json, on the release-please branch,
# before the tag exists.
#
# The placement is the whole design. .github/rulesets/main-branch.json allows
# only squash merges and sets strict_required_status_checks_policy, so a release
# branch cannot merge while it is behind main. An entry written here is
# therefore guaranteed to describe the bundle in the very commit that gets
# tagged — which is what lets check:published treat a tag with no ledger entry
# as a hard failure instead of something to tolerate after every release.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-ledger-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Record pending release
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tooling dependencies
        working-directory: tools
        run: bun install --frozen-lockfile

      - name: Record the pending release
        run: task ledger:record

      # Idempotent: a rerun after release-please rewrites its branch picks up
      # the new manifest version and pushes nothing if the entry is unchanged.
      # This cannot loop — a push made with GITHUB_TOKEN does not trigger
      # workflows.
      - name: Commit the ledger entry
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- published.json; then
            echo "published.json already current — nothing to push."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add published.json
          git commit -s -m 'chore(repo): record pending release in published.json'
          git push origin "HEAD:${HEAD_REF}"
