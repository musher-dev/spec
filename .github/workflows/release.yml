name: Release

# Every push to main runs this workflow, whether or not it releases anything,
# and every run ends by deploying the site exactly once. See
# docs/adr/0023-published-bytes-are-immutable-release-assets.md.
#
#   release-please  opens release pull requests; on a merged one, forces the tag
#                   at the merge commit and creates a DRAFT release.
#   plan            one matrix entry {tag, release_id} per release to finish.
#   artifacts       stages, attests and uploads the assets to the draft, then
#                   publishes it and proves GitHub made it immutable.
#   deploy          deploy.yml, last, unless a release in this run failed.
#
# A run that fails between the tag and the publication leaves a tag with no
# published release, and every later deploy fails site:fetch until it is
# recovered: dispatch this workflow with that tag. Each step below is written
# to be repeated, so a recovery does only what the failed run left undone.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to finish or re-verify, e.g. component/v1.0.0
        required: true
        type: string

permissions:
  contents: read

# Never cancelled: a run interrupted between creating a draft and publishing it
# is exactly the state the dispatch path exists to repair.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # release-please opens (and on merge, tags) a release PR per family. Tags land
  # as <family>/v<MAJOR>.<MINOR>.<PATCH> — see .github/release-please/config.json.
  #
  # It authenticates as the release GitHub App, not with GITHUB_TOKEN. A push
  # made with GITHUB_TOKEN triggers no workflow, so a release pull request
  # opened with it never reports Lint, Schema, Site Build or Signed off and can
  # merge only through the admin bypass ADR 0015 took out of daily use.
  # ---------------------------------------------------------------------------
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      # [{tag, release_id}], from release-please's per-path `<path>--tag_name`
      # and `<path>--id` outputs. Job outputs cannot have computed names, and
      # the paths contain slashes, so they travel as one JSON value.
      releases: ${{ steps.releases.outputs.releases }}
    steps:
      - name: Mint the release App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # release-please writes `signoff` verbatim as the Signed-off-by trailer of
      # its release commit, whose author is this App. dco.yml fails the release
      # pull request unless the trailer names that author, and release-please
      # reads the value from the default branch through the API, so it cannot be
      # injected here. Compare instead, before any commit is made with it: a
      # placeholder or a renamed App stops the run here rather than opening a
      # pull request that can never pass `Signed off`.
      - name: The configured sign-off names this App
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          bot="${APP_SLUG}[bot]"
          id="$(gh api "users/${bot}" --jq .id)"
          expected="${bot} <${id}+${bot}@users.noreply.github.com>"
          actual="$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/contents/.github/release-please/config.json?ref=${DEFAULT_BRANCH}" \
            | jq -r '.signoff // ""')"
          if [ "$actual" != "$expected" ]; then
            echo "::error file=.github/release-please/config.json::signoff is '${actual}', but release commits are authored as '${expected}'" >&2
            exit 1
          fi
          echo "Release commits are signed off as ${expected}"

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

      - name: Collect released tags and draft ids
        id: releases
        env:
          OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          set -euo pipefail
          releases="$(jq -c '
            . as $o
            | (($o.paths_released // "") | if . == "" then [] else fromjson end)
            | map({tag: $o[. + "--tag_name"], release_id: $o[. + "--id"]})
          ' <<<"$OUTPUTS")"
          if ! jq -e 'all(.[]; (.tag | type) == "string" and (.release_id | tostring | test("^[0-9]+$")))' \
               <<<"$releases" >/dev/null; then
            echo "::error::release-please reported a release without a tag or an id: ${releases}" >&2
            exit 1
          fi
          echo "releases=${releases}" >> "$GITHUB_OUTPUT"
          echo "Released: ${releases}"

  # ---------------------------------------------------------------------------
  # The matrix of releases to finish. On a push, what release-please just cut.
  # On a dispatch, the one tag named — and because the tags endpoint cannot see
  # a draft, its release is found by listing releases, and recreated as a draft
  # if the failed run never got as far as creating it.
  # ---------------------------------------------------------------------------
  plan:
    name: Plan
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Listing draft releases, and creating one, both need write access.
      contents: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Build the release matrix
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASES: ${{ needs.release-please.outputs.releases }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != 'workflow_dispatch' ]; then
            matrix="${RELEASES:-[]}"
          else
            if [[ ! "$TAG" =~ ^[a-z][a-z0-9-]*/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::'${TAG}' is not a release tag (<family>/v<MAJOR>.<MINOR>.<PATCH>)" >&2
              exit 1
            fi
            if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null; then
              echo "::error::${TAG} does not exist. Recovery finishes a tagged release; it never creates a tag." >&2
              exit 1
            fi

            ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .id')"
            count="$(printf '%s' "$ids" | grep -c . || true)"
            if [ "$count" -gt 1 ]; then
              echo "::error::${TAG} has ${count} releases; resolve by hand before recovering" >&2
              exit 1
            elif [ "$count" -eq 1 ]; then
              id="$ids"
            else
              id="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
                -f tag_name="$TAG" -f name="$TAG" -F draft=true \
                -f body="Recreated by release.yml recovery for ${TAG}." --jq .id)"
              echo "Recreated the missing draft for ${TAG} as release ${id}"
            fi
            matrix="$(jq -cn --arg tag "$TAG" --arg id "$id" '[{tag: $tag, release_id: $id}]')"
          fi
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Matrix: ${matrix}"

  # ---------------------------------------------------------------------------
  # For each release: build its assets with the tag's own tooling, attach them
  # to the draft, publish it, and prove GitHub holds it immutably.
  #
  # Data artifacts only — no binaries, no generated language bindings. See
  # GOVERNANCE.md → Binary policy.
  # ---------------------------------------------------------------------------
  artifacts:
    name: Release artifacts
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # An immutable release protects only what is published while the setting
      # is on; turning it on afterwards protects nothing already out. So refuse
      # before a single byte is uploaded. The endpoint needs administration read
      # access, which GITHUB_TOKEN cannot be granted, hence a token minted for
      # this step alone with nothing else in it.
      - name: Mint a settings-read App token
        id: settings
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-administration: read

      - name: Immutable releases are enabled
        env:
          GH_TOKEN: ${{ steps.settings.outputs.token }}
        run: |
          set -euo pipefail
          enabled="$(gh api "repos/${GITHUB_REPOSITORY}/immutable-releases" --jq .enabled)"
          if [ "$enabled" != 'true' ]; then
            echo "::error::Immutable releases are not enabled for ${GITHUB_REPOSITORY}. Enable them before publishing." >&2
            exit 1
          fi

      # The tag, not the push: the assets are built by the tooling the tag holds,
      # on the Bun version its own tools/.bun-version names, so a recovery
      # dispatched from a newer main still builds what the release recorded.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ matrix.tag }}
          fetch-depth: 0
          persist-credentials: false

      # release-please tags this push's commit, but nothing here says so, and the
      # assets are published as a description of the tag. Assert it rather than
      # depending on release-please internals staying put. On a dispatch the
      # push commit is unrelated, so the tag must at least be on the default
      # branch: a tag cut from anywhere else is not a release of this repository.
      - name: The tag points at the tree being built
        env:
          TAG: ${{ matrix.tag }}
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          tagged="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          head="$(git rev-parse HEAD)"
          if [ "$tagged" != "$head" ]; then
            echo "::error::${TAG} points at ${tagged}, but the checkout is ${head}" >&2
            exit 1
          fi
          if [ "$EVENT" = 'push' ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::${TAG} points at ${tagged}, but this run was pushed as ${GITHUB_SHA}" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tagged" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "::error::${TAG} (${tagged}) is not on ${DEFAULT_BRANCH}" >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: tools/.bun-version

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tooling dependencies
        working-directory: tools
        run: bun install --frozen-lockfile

      # release:stage refuses unless the tag's ledger entry equals main's, its
      # tree equals `<tag>:<path>`, the core gate holds at the tag, and a fresh
      # pinned build hashes to the recorded bundleSha256. Asset names are the
      # convention, not configuration: a kind family ships its bundle and its
      # archive, core ships the archive alone.
      - name: Stage release assets
        id: stage
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          task release:stage TAG="$TAG"

          family="${TAG%%/*}"
          version="${TAG#*/v}"
          assets=("${family}-v${version}.tar.gz")
          if [ "$family" != 'core' ]; then
            assets=("${family}.schema.json" "${assets[@]}")
          fi
          for asset in "${assets[@]}"; do
            if [ ! -f "dist/release/${asset}" ]; then
              echo "::error::task release:stage did not stage dist/release/${asset}" >&2
              exit 1
            fi
          done
          (cd dist/release && sha256sum "${assets[@]}")

          {
            echo "family=${family}"
            echo "major=v${version%%.*}"
            echo "archive=dist/release/${family}-v${version}.tar.gz"
            echo 'subjects<<SUBJECTS'
            printf 'dist/release/%s\n' "${assets[@]}"
            echo 'SUBJECTS'
          } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.stage.outputs.subjects }}

      # By release id, because the tags endpoint cannot see a draft. While the
      # release is a draft its assets are still ours to correct: an asset whose
      # digest already matches is left alone, one that differs is replaced, and
      # one this run did not stage is removed. Once published nothing may change,
      # so a published release is only compared — a mismatch there means the
      # build stopped being deterministic, and deserves a red X.
      - name: Upload assets to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          RELEASE_ID: ${{ matrix.release_id }}
          SUBJECTS: ${{ steps.stage.outputs.subjects }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          release="$(gh api "$api")"
          if [ "$(jq -r .tag_name <<<"$release")" != "$TAG" ]; then
            echo "::error::release ${RELEASE_ID} is for $(jq -r .tag_name <<<"$release"), not ${TAG}" >&2
            exit 1
          fi
          draft="$(jq -r .draft <<<"$release")"
          upload="$(jq -r '.upload_url | sub("\\{.*\\}$"; "")' <<<"$release")"
          mapfile -t subjects <<<"$SUBJECTS"

          names=()
          for path in "${subjects[@]}"; do
            name="$(basename "$path")"
            names+=("$name")
            want="sha256:$(sha256sum "$path" | cut -d' ' -f1)"
            asset="$(jq -c --arg n "$name" '.assets[] | select(.name == $n)' <<<"$release")"
            have="$(jq -r '.digest // ""' <<<"${asset:-null}")"

            if [ "$have" = "$want" ]; then
              echo "${name} already attached with ${want}"
            elif [ "$draft" != 'true' ]; then
              echo "::error::${TAG} is published, and ${name} is '${have:-missing}' rather than ${want}" >&2
              exit 1
            else
              if [ -n "$asset" ]; then
                echo "Replacing ${name} (${have:-no digest})"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$(jq -r .id <<<"$asset")"
              fi
              gh api -X POST -H 'Content-Type: application/octet-stream' \
                "${upload}?name=${name}" --input "$path" --jq '"Uploaded \(.name) \(.digest)"'
            fi
          done

          if [ "$draft" = 'true' ]; then
            jq -r '.assets[] | "\(.id)\t\(.name)"' <<<"$release" | while IFS=$'\t' read -r id name; do
              if ! printf '%s\n' "${names[@]}" | grep -qxF "$name"; then
                echo "Removing ${name}, which this release does not stage"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}"
              fi
            done
          fi

      # A kind family names the core edition it was built against, read from the
      # release.json inside the archive just staged. The body is edited only
      # while the release is a draft, and only once.
      - name: Note the core edition
        if: steps.stage.outputs.family != 'core'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ matrix.release_id }}
          FAMILY: ${{ steps.stage.outputs.family }}
          MAJOR: ${{ steps.stage.outputs.major }}
          ARCHIVE: ${{ steps.stage.outputs.archive }}
        run: |
          set -euo pipefail
          meta="$(tar -xzOf "$ARCHIVE" "${FAMILY}-${MAJOR}/release.json")"
          edition="$(jq -r '.requires.core // ""' <<<"$meta")"
          if [[ ! "$edition" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::${ARCHIVE} release.json names no core edition: ${meta}" >&2
            exit 1
          fi
          note="Built against Musher Document Core v${edition} (core/v${edition})"

          api="repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          release="$(gh api "$api")"
          body="$(jq -r '.body // ""' <<<"$release")"
          if printf '%s' "$body" | grep -qF "$note"; then
            echo "Already noted: ${note}"
          elif [ "$(jq -r .draft <<<"$release")" != 'true' ]; then
            echo "::warning::the published release does not carry '${note}'"
          else
            gh api -X PATCH "$api" -f body="${body}"$'\n\n'"${note}" >/dev/null
            echo "Noted: ${note}"
          fi

      # Not marked latest: four trains share one repository, and whichever
      # released last is not the one a reader wants. Then read the release back:
      # publication is only done when GitHub reports it immutable and holds
      # exactly the staged assets under the staged digests.
      - name: Publish and verify immutability
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
          RELEASE_ID: ${{ matrix.release_id }}
          SUBJECTS: ${{ steps.stage.outputs.subjects }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          if [ "$(gh api "$api" --jq .draft)" = 'true' ]; then
            gh api -X PATCH "$api" -F draft=false -f make_latest=false >/dev/null
            echo "Published ${TAG}"
          fi

          release="$(gh api "$api")"
          failed=0
          if [ "$(jq -r .draft <<<"$release")" != 'false' ]; then
            echo "::error::${TAG} is still a draft" >&2; failed=1
          fi
          if [ "$(jq -r .immutable <<<"$release")" != 'true' ]; then
            echo "::error::${TAG} was published but GitHub does not report it immutable" >&2; failed=1
          fi

          mapfile -t subjects <<<"$SUBJECTS"
          expected="$(for path in "${subjects[@]}"; do
            printf '%s\tsha256:%s\n' "$(basename "$path")" "$(sha256sum "$path" | cut -d' ' -f1)"
          done | sort)"
          actual="$(jq -r '.assets[] | "\(.name)\t\(.digest)"' <<<"$release" | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::${TAG} assets do not match what was staged" >&2
            diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo "${TAG} is published, immutable, and holds:"
          printf '%s\n' "$actual"

  # ---------------------------------------------------------------------------
  # Deploy, once per run and always last, so the site a push produces includes
  # every release that push published. A release that failed stops the deploy:
  # site:fetch would refuse its unpublished tag anyway, and the red X belongs on
  # the job that can be recovered. Skipped artifacts — a push that released
  # nothing — deploy as normal.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: [plan, artifacts]
    if: ${{ !cancelled() && needs.plan.result != 'failure' && needs.artifacts.result != 'failure' }}
    permissions:
      contents: read
    # A reusable workflow inherits no secrets by default. Without this the
    # deploy would fail on exactly the run that matters most — the one that
    # publishes a version at its own immutable URL for the first time.
    secrets: inherit
    uses: ./.github/workflows/deploy.yml
