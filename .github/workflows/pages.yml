name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by release.yml immediately after a tag is created. Without this, the
  # Pages run racing a release would enumerate tags before the tag for that very
  # release existed, and the new version would not appear until the next push.
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    name: Publish schemas.musher.dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level, not workflow-level. A workflow-level group would be held by the
    # calling workflow while this job waited for the same group, which
    # deadlocks; and only a job-level group serialises across both the push and
    # the workflow_call path. Never cancel in flight — an interrupted deploy
    # would leave the published origin in an indeterminate state.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Full history and every tag: pinned URLs are rebuilt from the tags, so a
      # shallow checkout here would unpublish every released version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tooling dependencies
        working-directory: tools
        run: bun install --frozen-lockfile

      # Publish exactly what is committed. The drift gate in ci.yml is what
      # guarantees the committed bundle matches its sources, so this must not
      # rebuild — a rebuild here would let an unreviewed bundle reach the
      # public origin.
      - name: Verify committed bundles are current
        run: task check:drift

      # Every released version must still hash to what published.json recorded.
      # A rewritten tag or an edited ledger stops the deploy here rather than
      # silently altering a URL documented as immutable forever.
      - name: Verify published versions
        run: task check:published

      - name: Assemble publication tree
        run: task site:build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
