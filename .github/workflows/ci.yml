name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint — formatting and static analysis of the non-normative surface
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: check:adr compares every accepted ADR against the base
      # commit, and a depth-1 clone does not carry it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tooling dependencies
        working-directory: tools
        run: bun install --frozen-lockfile

      # The release tarball, verified against a pinned SHA-256, rather than
      # piping an install script from a URL into bash. The script is fetched
      # from a mutable ref and executed unverified, which made it the one place
      # in CI where an upstream compromise would run arbitrary code with the
      # workflow's token.
      #
      # Keep ACTIONLINT_VERSION in step with .devcontainer/mise.toml. CI is not
      # a mise host and does not read that file.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.11
          ACTIONLINT_SHA256: 900919a84f2229bac68ca9cd4103ea297abc35e9689ebb842c6e34a3d1b01b0a
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint

      # BASE_REF is empty on a push, where check:adr falls back to origin/main.
      - name: Run lint suite
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: task ci:lint

      - name: Typecheck tooling
        run: task check:types

  # ---------------------------------------------------------------------------
  # Schema — the normative gates
  # ---------------------------------------------------------------------------
  schema:
    name: Schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history and tags: check:compat replays each released version's
      # accepted documents out of that version's own tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tooling dependencies
        working-directory: tools
        run: bun install --frozen-lockfile

      # Every check here builds the bundles in memory from schemas/src; none is
      # committed (docs/adr/0023). check:generated fails if git tracks any build
      # output, which is what stops a committed copy from becoming a second,
      # divergent source of truth.
      - name: Schema, examples, conformance
        run: task ci:test

      # Build output for reviewers: dist/ holds every bundle and the catalog,
      # uploaded below, so the bytes a pull request would publish can be read
      # without a checkout.
      - name: Build bundles
        run: task bundle

      - name: Traceability matrix is current
        run: |
          task traceability
          if ! git diff --quiet -- docs/traceability.md; then
            echo "::error file=docs/traceability.md::stale. Run 'task traceability' and commit." >&2
            git --no-pager diff -- docs/traceability.md
            exit 1
          fi

      # Reporting only, and deliberately not a gate: check:compat above is the
      # gate. This says what the pull request does to the contract in the terms
      # a reviewer of a specification cares about — which fields are required,
      # enum members, bounds, defaults, diagnostics — which a JSON diff of a
      # 900-line bundle does not. `--diff` appends the unified diff of each built
      # bundle, base against head, for the reviewer who wants the bytes too.
      # Written to the step summary rather than posted as a comment, so the job
      # needs no write permission on the pull request.
      - name: Contract change report
        if: github.event_name == 'pull_request'
        # base_ref reaches the shell through the environment, never through
        # ${{ }} interpolation into the script: a branch name is attacker-chosen
        # on a fork pull request, and interpolation would run it.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          task changes BASE="origin/$BASE_REF" -- --diff >> "$GITHUB_STEP_SUMMARY"

      - name: Upload built bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Site — prove the publication tree assembles before a release depends on it
  # ---------------------------------------------------------------------------
  site:
    name: Site Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history and every tag: pinned paths are rebuilt from the tags, and
      # the ledger's append-only check compares against the base commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tooling dependencies
        working-directory: tools
        run: bun install --frozen-lockfile

      # Every released version must still hash to what published.json recorded,
      # and nothing already recorded may be edited or removed.
      - name: Verify published versions
        run: task check:published

      - name: Ledger is append-only
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: task check:ledger

      # No `task bundle` first: the site builds every untagged alias in memory,
      # and this step is what proves a clean checkout needs nothing more.
      - name: Assemble publication tree
        run: |
          task site:build
          find site -type f | sort
